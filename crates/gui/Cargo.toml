[package]
name = "gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lastissue-gui"
path = "src/main.rs"

[dependencies]
lastissue.workspace = true
chrono.workspace = true
directories.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-component.workspace = true
# runtime_shaders: no Xcode Metal Toolchain needed to build; revisit for the .app bundle (M6).
# font-kit: without it the macOS platform renders no text.
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
notify.workspace = true
rayon.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
