[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/desktop/src-tauri"]
default-members = ["crates/core", "crates/cli", "crates/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
lastissue = { package = "lastissue-core", path = "crates/core" }

chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
inquire = "0.9.4"
mail-parser = "0.11.9"
notify = "8.2.0"
rayon = "1.12.0"
regex = "1.13.1"
serde_json = "1.0.154"
ulid = "3.0.0"
ureq = "3.5.0"

serde = { version = "1.0.229", features = ["derive"] }

tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-dialog = "2.8.4"

assert_cmd = "2.2.2"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
insta = { version = "1.49.0", features = ["filters"] }
mockito = "1.7.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Policy: pedantic lints we don't want.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Too many hits to be worth fixing; unreadable_literal: hash constants.
many_single_char_names = "allow"
map_unwrap_or = "allow"
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow"
unreadable_literal = "allow"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
